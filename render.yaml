# Render Blueprint — deploy "New +" -> Blueprint (or import this file from the dashboard).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zita-plm
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Leave these sync:false and fill in the values in
      # Dashboard -> zita-plm -> Environment after creation.
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSL
        value: "true"
      - key: TOKEN_SECRET
        generateValue: true